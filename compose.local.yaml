name: seal-local

services:
  frontend:
    build:
      context: ./Front
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    environment:
      NODE_ENV: production
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./Back
    restart: unless-stopped
    env_file:
      - ./Back/.env
    environment:
      NODE_ENV: production
      PORT: 3001
      PUBLIC_API_URL: https://${LOCAL_HOST:-localhost}
      TRUST_PROXY_HOPS: 1
      FRONT_RESET_URL: https://${LOCAL_HOST:-localhost}/reset-password
      FRONT_ACTIVATION_URL: https://${LOCAL_HOST:-localhost}/activar-cuenta
      FRONT_SIGN_URL: https://${LOCAL_HOST:-localhost}/firma-movil
      AUTH_COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGINS: https://${LOCAL_HOST:-localhost}
    volumes:
      - ./Back/secrets:/app/secrets:ro
      - backend_local_storage:/app/.local-storage
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  backend_local_storage:
