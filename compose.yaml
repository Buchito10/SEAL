name: seal

services:
  frontend:
    build:
      context: ./Front
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.50
    environment:
      NODE_ENV: production
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./Back
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.75
    env_file:
      - ./Back/.env
    environment:
      NODE_ENV: production
      PORT: 3001
      PUBLIC_API_URL: https://${DOMAIN}
      TRUST_PROXY_HOPS: 1
      FRONT_RESET_URL: https://${DOMAIN}/reset-password
      FRONT_ACTIVATION_URL: https://${DOMAIN}/activar-cuenta
      FRONT_SIGN_URL: https://${DOMAIN}/firma-movil
      AUTH_COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}
    volumes:
      - ./Back/secrets:/app/secrets:ro
      - backend_storage:/app/.local-storage
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        envsubst '$${DOMAIN}' \
          < /etc/nginx/templates/default.conf.template \
          > /etc/nginx/conf.d/default.conf
        (while :; do sleep 6h; nginx -s reload; done) &
        exec nginx -g 'daemon off;'

  certbot:
    image: certbot/certbot:v5.7.0
    restart: unless-stopped
    mem_limit: 96m
    cpus: 0.25
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap exit TERM
        while :; do
          certbot renew --webroot --webroot-path=/var/www/certbot --quiet
          sleep 12h
        done

  storage-backup:
    image: alpine:3.22
    restart: unless-stopped
    mem_limit: 32m
    cpus: 0.10
    environment:
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - backend_storage:/data:ro
      - ./backups:/backups
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /backups
        while :; do
          stamp=$$(date -u +%Y%m%d-%H%M%S)
          tar -czf "/backups/seal-storage-$${stamp}.tar.gz" -C /data .
          find /backups -type f -name 'seal-storage-*.tar.gz' -mtime +$${BACKUP_RETENTION_DAYS} -delete
          sleep $$((BACKUP_INTERVAL_HOURS * 3600))
        done

volumes:
  backend_storage:
